# DigitalOcean single-Droplet deployment: nginx + the Next.js app + Postgres on a
# private network. The app is built from this repo (`build: .`) but is NOT published
# to the host — only nginx is (ports 80/443). Both the app (:3000) and Postgres
# (:5432) are reachable only over the internal Docker network, so there's nothing to
# firewall on those ports.
#
# Variable interpolation (${...}) and the app's env_file both read `.env` in this
# directory. See .env.production.example for the template.

services:
  db:
    image: postgres:18-alpine  # match the source RDS major version (dump is from pg 18)
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SQL_DB_USER}
      POSTGRES_PASSWORD: ${SQL_DB_PASSWORD}
      POSTGRES_DB: ${SQL_DB_NAME}
    volumes:
      # postgres:18+ stores data in a versioned subdir and wants the volume at
      # /var/lib/postgresql (NOT .../data, which was the convention up to pg17).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SQL_DB_USER} -d ${SQL_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Override DB connection to point at the compose service over the private
      # network, with TLS off (the link never leaves the Docker network).
      NODE_ENV: production
      SQL_DB_HOST: db
      SQL_DB_PORT: "5432"
      SQL_DB_SSL: "false"
    # No public port: the app is reachable only by nginx over the private network.

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      # `edge` is an external network shared with the MCP server's separate compose
      # stack, so nginx can proxy wsdb.finmon.uk to it. Naming any network here
      # disables the implicit `default` join, so `default` must be listed explicitly.
      - default
      - edge

volumes:
  pgdata:

networks:
  # Created out-of-band on the server (`docker network create edge`) because it is shared
  # with another compose project; `docker compose up` will fail if it does not exist.
  edge:
    external: true
