# Reverse proxy for the MCP server, which runs in a SEPARATE docker compose stack on the
# same droplet. The two stacks meet on the external `edge` network (see docker-compose.yml).
#
# TLS reuses the same Cloudflare Origin Certificate as finmon.uk — it is issued for
# `finmon.uk, *.finmon.uk`, so the wildcard already covers this subdomain. Nothing to renew.

# Redirect all plain HTTP to HTTPS.
server {
    listen 80;
    server_name wsdb.finmon.uk;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name wsdb.finmon.uk;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    location / {
        # Resolve the upstream per-request via Docker's embedded DNS. With a literal
        # hostname nginx resolves at startup and REFUSES TO BOOT if the MCP container is
        # down — which would take finmon.uk down with it. A variable defers resolution to
        # request time, but then the URI is no longer passed implicitly and $request_uri
        # must be appended explicitly.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $mcp http://wsnotifier-mcp-1:8000;
        proxy_pass $mcp$request_uri;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
    }
}
