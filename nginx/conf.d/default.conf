# Redirect all plain HTTP to HTTPS.
server {
    listen 80;
    server_name your-domain.com;
    return 301 https://$host$request_uri;
}

# HTTPS reverse proxy in front of the Next.js app.
# TLS here uses a Cloudflare Origin Certificate (cert + key in ./nginx/certs).
# Cloudflare runs in front (SSL/TLS mode: Full strict), so the browser-facing
# cert is Cloudflare's edge cert; this one secures Cloudflare <-> origin.
server {
    listen 443 ssl;
    http2 on;
    server_name your-domain.com;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    location / {
        proxy_pass http://app:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
